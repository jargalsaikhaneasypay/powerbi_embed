apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerbi-embed
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: powerbi-embed
  template:
    metadata:
      labels:
        app: powerbi-embed
    spec:
      containers:
        - name: powerbi-embed
          image: powerbi-embed:latest
          ports:
            - containerPort: 3001
          env:
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: powerbi-secret
                  key: CLIENT_SECRET
            - name: REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: powerbi-secret
                  key: REDIRECT_URI
            - name: PORT
              value: "3001"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: powerbi-data-pvc
